databases:
  - name: arbiconstruct-db
    databaseName: arbiconstruct
    user: arbiconstruct
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: arbiconstruct-api
    runtime: docker
    dockerfilePath: arbi-construct-ai/apps/api/Dockerfile
    dockerContext: arbi-construct-ai
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arbiconstruct-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-ada-002
      - key: LLM_PROVIDER
        value: openai
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_PATH
        value: /app/data/uploads
      - key: CORS_ORIGINS
        value: https://arbiconstruct-web.onrender.com,http://localhost:3000
    healthCheckPath: /health

  - type: web
    name: arbiconstruct-web
    runtime: node
    rootDir: arbi-construct-ai/apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://arbiconstruct-api.onrender.com
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
