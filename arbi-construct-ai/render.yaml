databases:
  - name: arbiconstruct-db
    databaseName: arbiconstruct
    user: arbiconstruct
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: arbiconstruct-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arbiconstruct-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-ada-002
      - key: LLM_PROVIDER
        value: openai
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_PATH
        value: /app/data/uploads
    healthCheckPath: /health
    buildCommand: ""
    startCommand: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT"

  - type: web
    name: arbiconstruct-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false   # Set to https://<arbiconstruct-api>.onrender.com after first deploy
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
