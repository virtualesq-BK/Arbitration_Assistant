version: "3.9"
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: arbiconstruct
      POSTGRES_USER: arbiconstruct
      POSTGRES_PASSWORD: arbiconstruct_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbiconstruct"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Inside the compose network the database is reachable as "db", not localhost.
      DATABASE_URL: postgresql+asyncpg://arbiconstruct:arbiconstruct_dev@db:5432/arbiconstruct
      LOCAL_STORAGE_PATH: /app/data/uploads
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/uploads:/app/data/uploads

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]

volumes:
  pgdata:
